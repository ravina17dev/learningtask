<!DOCTYPE html>
<html>
    <head>
        <title>..: Basic HTML Layout :..</title>
        <style  type="text/css">
            .wrapper {
                background-color:#cccccc;
            }
            .header {
                background-color: blue;
                height: 200px;
                color: white;
            }
            .body {
                background-color: red;
                min-height: 200px;
                color: white;
            }
            .navigation {
                width: 25%;
                background-color: red;
                height: 200px;
                float: left;

            }
            .content {
background-color: green;
width: 75%;
height: 200px;
float: right;
            }
            .footer {
                background-color: grey;
                height: 100px;

            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="header">
                HEADER
            </div>
            <div class="body">
                <div class="navigation"></div>
                <div class="content"></div>
            </div>
                <div class="footer"></div>
        </div>
    </body>
</html>
