<!DOCTYPE html>
<html>
    <head>
        <title>..: Four Boxes :..</title>
        <style  type="text/css">
            body {
                background-color: #4d4b5e;
            }
            .wrapper {
                background-color:#fff;
                width: 400px;
                height: 400px;
                border-top: 2px solid #5142f5;
                border-left: 2px solid #f5425a;
                border-right: 2px solid #f542c2;
                border-bottom: 2px solid #5142f5;
                margin: 0 auto;
            }
            .wrapper div {
                width: 192px;
                height: 192px;
                margin:2px;
                border: 2px solid red;
                float: left;
            }
            .box1 {
                background-color: #7fb319;
            }
            .box2 {
                background-color: #b39e19;
            }
            .box3 {
                background-color: #9e19b3;
            }
            .box4 {
                background-color: #19b39e;
            }
            </style>
    </head>
          <body>
            <div class="wrapper">  
                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>
                <div class="box4"></div>
            </div>
    </body>
</html>
